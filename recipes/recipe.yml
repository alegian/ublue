---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: ublue
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-nvidia
image-version: 44 # can be latest

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      cleanup: true
      files:
        - smallstep.repo
        - openrazer-terra.repo
      copr:
        - atim/starship
        - tofik/nwg-shell
        - swayfx/swayfx
        - erikreider/SwayNotificationCenter
        - alternateved/cliphist
        - lihaohong/yazi
        - leloubil/wl-clip-persist
    install:
      packages:
        - micro
        - starship
        - sway-config-fedora
        - swayfx
        - NetworkManager-openvpn
        - golang
        - nm-connection-editor
        - network-manager-applet
        - pavucontrol
        - wlogout
        - blueman-applet
        - btop
        - ddcutil
        - light
        - qt6ct
        - nwg-look
        - alacritty
        - ripgrep
        - gammastep
        - gvfs
        - nautilus
        - SwayNotificationCenter
        - chezmoi
        - make
        - gcc
        - cliphist
        - java-25-openjdk
        - maven
        - grim
        - slurp
        - yazi
        - age
        - gtklock
        - ImageMagick
        - greetd
        - gtkgreet
        - python3-tmuxp
        - flite
        - wl-clip-persist
        - rofimoji
        - postgresql
        - gnome-keyring
        - nmap
        - cronie
        - gh
        - gtk3-devel
        - mesa-demos
        - zlib-ng-compat.i686
        - bzip2-libs.i686
        - chromium
        - git-delta
        - libxcrypt-compat
        - sox
        - gcc-c++
        - cmake
        - python3-pip
        - ibus-devel
        - gobject-introspection-devel
        - python3-devel
        - portaudio-devel
        - python3-virtualenv
        - vulkan-tools
        - vulkan-loader-devel
        - glslc
        - patchelf
        - fuse-libs
        - tree-sitter-cli
        - step-cli
        - https://api2.cursor.sh/updates/download/golden/linux-x64-rpm/cursor/latest
        - https://cdn.insynchq.com/builds/linux/3.9.11.60043/insync-3.9.11.60043-fc44.x86_64.rpm
        - https://cdn.insynchq.com/builds/linux/3.9.5.60024/insync-nautilus-3.9.5.60024-1.noarch.rpm
        - openrazer-daemon

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - app.polychromatic.controller
          - com.brave.Browser
          - com.discordapp.Discord
          - com.github.ahrm.sioyek
          - com.obsproject.Studio
          - com.protonvpn.www
          - com.spotify.Client
          - com.stremio.Stremio
          - com.valvesoftware.Steam
          - com.visualstudio.code
          - io.dbeaver.DBeaverCommunity
          - io.github.shiftey.Desktop
          - net.blockbench.Blockbench
          - org.blender.Blender
          - org.fedoraproject.MediaWriter
          - org.gimp.GIMP
          - org.prismlauncher.PrismLauncher
          - org.qbittorrent.qBittorrent
          - org.telegram.desktop
          - org.videolan.VLC
      - scope: user # Also add Flathub user repo, but no user packages

  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly
      google-fonts:
        - Roboto Mono
      url-fonts:
        - name: NotoColorEmoji
          url: https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf

  - type: akmods
    install:
      - openrazer

  - type: kargs
    kargs:
      - acpi_osi="!Windows 2015"

  - type: script
    scripts:
      - neovim.sh
      - proton-pass-cli.sh
      - sway-startup.sh
    snippets:
      - systemctl set-default graphical.target

  - type: systemd
    system:
      enabled:
        - podman.socket
        - greetd.service

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
